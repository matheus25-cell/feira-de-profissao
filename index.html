<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tetris</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111827;
      font-family: Arial, sans-serif;
      color: white;
    }

    .game {
      display: flex;
      gap: 25px;
      align-items: flex-start;
      padding: 20px;
    }

    canvas {
      background: #020617;
      border: 4px solid #475569;
      border-radius: 8px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.5);
    }

    .side {
      width: 180px;
    }

    h1 {
      margin-top: 0;
      font-size: 36px;
      text-align: center;
      color: #38bdf8;
      text-shadow: 0 0 10px #38bdf8;
    }

    .info {
      background: #1e293b;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .info p {
      margin: 10px 0;
      font-size: 18px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #38bdf8;
      color: #082f49;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #7dd3fc;
    }

    .controls {
      margin-top: 15px;
      text-align: center;
      color: #cbd5e1;
      font-size: 14px;
      line-height: 1.7;
    }

    @media (max-width: 600px) {
      .game {
        flex-direction: column;
        align-items: center;
      }

      .side {
        width: 300px;
      }

      h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <div class="game">

    <canvas id="tetris" width="300" height="600"></canvas>

    <div class="side">
      <h1>TETRIS</h1>

      <div class="info">
        <p>Pontos: <strong id="score">0</strong></p>
        <p>Linhas: <strong id="lines">0</strong></p>
        <p>Nível: <strong id="level">1</strong></p>
      </div>

      <button onclick="restartGame()">Reiniciar</button>

      <div class="controls">
        ← → &nbsp; Mover<br>
        ↓ &nbsp; Acelerar<br>
        ↑ &nbsp; Girar<br>
        Espaço &nbsp; Queda rápida
      </div>
    </div>

  </div>

<script>
const canvas = document.getElementById("tetris");
const ctx = canvas.getContext("2d");

const COLS = 10;
const ROWS = 20;
const BLOCK = 30;

ctx.scale(BLOCK, BLOCK);

const colors = [
  null,
  "#00f0f0", // I
  "#0000f0", // J
  "#f0a000", // L
  "#f0f000", // O
  "#00f000", // S
  "#a000f0", // T
  "#f00000"  // Z
];

const pieces = [
  [
    [1, 1, 1, 1]
  ],
  [
    [2, 0, 0],
    [2, 2, 2]
  ],
  [
    [0, 0, 3],
    [3, 3, 3]
  ],
  [
    [4, 4],
    [4, 4]
  ],
  [
    [0, 5, 5],
    [5, 5, 0]
  ],
  [
    [0, 6, 0],
    [6, 6, 6]
  ],
  [
    [7, 7, 0],
    [0, 7, 7]
  ]
];

let board;
let player;
let score = 0;
let lines = 0;
let level = 1;
let dropCounter = 0;
let lastTime = 0;
let gameOver = false;

function createBoard() {
  return Array.from(
    { length: ROWS },
    () => Array(COLS).fill(0)
  );
}

function createPiece() {
  const piece =
    pieces[Math.floor(Math.random() * pieces.length)];

  return piece.map(row => [...row]);
}

function resetPlayer() {
  player.matrix = createPiece();

  player.pos.y = 0;
  player.pos.x =
    Math.floor(COLS / 2) -
    Math.floor(player.matrix[0].length / 2);

  if (collide()) {
    gameOver = true;
    alert("Game Over! Pontuação: " + score);
  }
}

function drawMatrix(matrix, offset) {
  matrix.forEach((row, y) => {
    row.forEach((value, x) => {
      if (value !== 0) {
        ctx.fillStyle = colors[value];

        ctx.fillRect(
          x + offset.x,
          y + offset.y,
          1,
          1
        );

        ctx.strokeStyle = "#0f172a";
        ctx.lineWidth = 0.05;

        ctx.strokeRect(
          x + offset.x,
          y + offset.y,
          1,
          1
        );
      }
    });
  });
}

function draw() {
  ctx.fillStyle = "#020617";
  ctx.fillRect(0, 0, COLS, ROWS);

  drawMatrix(board, { x: 0, y: 0 });
  drawMatrix(player.matrix, player.pos);
}

function collide() {
  const m = player.matrix;
  const o = player.pos;

  for (let y = 0; y < m.length; y++) {
    for (let x = 0; x < m[y].length; x++) {

      if (
        m[y][x] !== 0 &&
        (
          board[y + o.y] === undefined ||
          board[y + o.y][x + o.x] !== 0
        )
      ) {
        return true;
      }
    }
  }

  return false;
}

function merge() {
  player.matrix.forEach((row, y) => {
    row.forEach((value, x) => {
      if (value !== 0) {
        board[y + player.pos.y][x + player.pos.x] = value;
      }
    });
  });
}

function playerDrop() {
  player.pos.y++;

  if (collide()) {
    player.pos.y--;
    merge();
    clearLines();
    resetPlayer();
  }

  dropCounter = 0;
}

function playerMove(dir) {
  player.pos.x += dir;

  if (collide()) {
    player.pos.x -= dir;
  }
}

function rotate(matrix) {
  return matrix[0].map(
    (_, index) =>
      matrix.map(row => row[index]).reverse()
  );
}

function playerRotate() {
  const oldMatrix = player.matrix;
  const oldX = player.pos.x;

  player.matrix = rotate(player.matrix);

  let offset = 1;

  while (collide()) {
    player.pos.x += offset;

    offset = -(offset + (offset > 0 ? 1 : -1));

    if (offset > player.matrix[0].length) {
      player.matrix = oldMatrix;
      player.pos.x = oldX;
      return;
    }
  }
}

function hardDrop() {
  while (!collide()) {
    player.pos.y++;
  }

  player.pos.y--;
  merge();
  clearLines();
  resetPlayer();
  dropCounter = 0;
}

function clearLines() {
  let cleared = 0;

  outer:
  for (let y = ROWS - 1; y >= 0; y--) {

    for (let x = 0; x < COLS; x++) {
      if (board[y][x] === 0) {
        continue outer;
      }
    }

    const row = board.splice(y, 1)[0];

    board.unshift(row.fill(0));

    y++;
    cleared++;
  }

  if (cleared > 0) {
    const points = [0, 100, 300, 500, 800];

    score += points[cleared] * level;
    lines += cleared;

    level = Math.floor(lines / 10) + 1;

    updateSpeed();
    updateInfo();
  }
}

function updateSpeed() {
  dropInterval =
    Math.max(100, 1000 - (level - 1) * 80);
}

function updateInfo() {
  document.getElementById("score").textContent = score;
  document.getElementById("lines").textContent = lines;
  document.getElementById("level").textContent = level;
}

let dropInterval = 1000;

function update(time = 0) {
  const deltaTime = time - lastTime;

  lastTime = time;
  dropCounter += deltaTime;

  if (!gameOver && dropCounter > dropInterval) {
    playerDrop();
  }

  draw();

  requestAnimationFrame(update);
}

function restartGame() {
  board = createBoard();

  player = {
    pos: {
      x: 0,
      y: 0
    },
    matrix: null
  };

  score = 0;
  lines = 0;
  level = 1;
  gameOver = false;
  dropInterval = 1000;

  updateInfo();
  resetPlayer();
}

document.addEventListener("keydown", event => {

  if (gameOver) return;

  if (event.key === "ArrowLeft") {
    playerMove(-1);
  }
